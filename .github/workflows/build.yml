name: Build and verify blog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run indexnow -- --dry-run
      - run: node scripts/verify-indexnow.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: blog-standalone-preview
          path: 完整博客预览.html
